name: Deploy to GitHub Pages

on:
  push:
    branches: [flutter]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Build Virtual MRI Scanner
      - name: Build Virtual MRI Scanner
        run: |
          flutter pub get
          flutter build web --release --base-href "/virtualmri/" --target lib/vmri/main.dart

      # Build Parameter Image Calculator
      - name: Build Parameter Image Calculator
        run: |
          # Save the VMRI build output
          mv build/web build/vmri_web
          flutter build web --release --base-href "/virtualmri/pic/" --target lib/paracalc/main.dart

      # Combine both builds into a single deployment artifact
      - name: Prepare deployment
        run: |
          mkdir -p build/vmri_web/pic
          cp -r build/web/* build/vmri_web/pic/
          mv build/vmri_web build/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
